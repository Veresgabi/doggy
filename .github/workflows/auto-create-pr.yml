name: Auto Create Pull Request

# Force GitHub Actions JavaScript-based actions to run on Node24 (opt-in ahead of runner default change)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches:
      - 'feature/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create PR if none exists
        uses: actions/github-script@v7
        with:
          script: |
            // Create a pull request from the pushed branch to `master` if one does not already exist.
            const base = 'master';
            const head = context.ref.replace('refs/heads/', '');

            // Don't attempt to create a PR if the pushed branch is the base.
            if (head === base) {
              console.log(`Pushed branch is the base branch (${base}); nothing to do.`);
              return;
            }

            // Check for existing open PRs for this head -> base combination
            const existing = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${head}`,
              base: base
            });

            if (existing.data && existing.data.length > 0) {
              console.log(`Open PR already exists: ${existing.data[0].html_url}`);
              return;
            }

            const title = `Auto PR: ${head}`;
            const body = `This pull request was created automatically from branch \`${head}\` to \`${base}\`.`;

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              head,
              base,
              body,
              draft: false
            });

            console.log(`Created PR: ${pr.data.html_url}`);

